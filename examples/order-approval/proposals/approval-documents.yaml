# An example Proposal: what an agent (lore-extract skill) writes after reading the converted
# Word BRD and the PDF of the Confluence approval rules. Apply it to a copy of the demo with
#   lore convert && lore propose proposals/approval-documents.yaml
# Each cite gives a verbatim quote; `lore propose` finds it and records the exact span.
title: Approval threshold and four-eyes rule from the BRD and the Confluence rules
pages:
  - id: conflicts/approval-threshold-amount
    type: Spec Conflict
    title: Approval threshold amount
    description: The Confluence approval rules say 10 000 EUR, the BRD says 5 000 EUR.
    about: [approvals/rules/approval-threshold]
    body: |
      # Approval threshold amount

      | Source | Value | Date |
      |---|---|---|
      | Approval rules (Confluence) v12[^rules] | 10 000 EUR | 2026-06-01 |
      | Purchase approval BRD v2[^brd] | 5 000 EUR | 2025-03-14 |

      The newer page is not automatically right. **Who can answer:** the product owner for Approvals.
    cites:
      rules:
        doc: docs/approval-rules.pdf
        quote: Every order with a total above 10 000 EUR needs approval.
      brd:
        doc: docs/purchase-approval-brd.docx
        quote: Every order with a total above 5 000 EUR needs approval before it is processed.
  # The four-eyes page is human-reviewed: add the two documents as Sources and keep the review.
  - id: approvals/rules/four-eyes
    cites:
      brd:
        doc: docs/purchase-approval-brd.docx
        quote: The approver must not be the buyer who placed the order (four-eyes principle).
        after: they placed.
      rules:
        doc: docs/approval-rules.pdf
        quote: The approver must not be the buyer who placed the order.
        after: they placed.
  # The policy leaves "new buyer" open: record an Open Question, do not guess. The questions page
  # is given with a full body (the existing text, then the item), so its review is removed.
  - id: questions
    type: Open Questions
    title: Open questions
    description: Ambiguities that neither the Sources nor the code settle, waiting for a person.
    body: |
      # Open questions

      Add one item per question. Link the pages it affects and say who can answer it.
      When it is answered, update the pages, cite the answer as a Source and remove the item.

      - **How long does a buyer count as new?** The policy requires an extra check for orders from a new buyer but gives no period. Affects [Approval threshold](/approvals/rules/approval-threshold.md). Who can answer: Finance, the owner of the BRD.
