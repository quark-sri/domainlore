<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">domainlore</title>
  <desc id="desc">domainlore: sourced domain knowledge for AI coding agents. Workflow: 1 extract facts from documents and code, 2 check gaps and conflicts, a person reviews the Proposal, 3 build indexes and diagrams, 4 agents use the facts. Every fact has a source.</desc>
