name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Demo Knowledge Base is current and valid
        run: uv run lore check --root examples/order-approval
      - name: Retrieval eval
        run: uv run python evals/retrieval.py --min-hit 0.9

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generated JSON Schemas match schema/domainlore.yaml
        run: ./scripts/gen-schema.sh && git diff --exit-code src/domainlore/schemas
